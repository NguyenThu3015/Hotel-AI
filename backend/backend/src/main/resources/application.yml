spring:
  application:
    name: hotel-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_db
    username: hotel_user
    password: hotel_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:hotel_password}
    listener:
      simple:
        default-requeue-rejected: false

hotel:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 7
    identity-jwk-set-uri: ${IDENTITY_JWK_SET_URI:}
    identity-issuer: ${IDENTITY_JWT_ISSUER:http://identity-service:8101}
    identity-audience: ${IDENTITY_JWT_AUDIENCE:hotel-api}
  booking:
    hold-minutes: 15
  pricing:
    tax-rate: 0.10
    service-fee-rate: 0.05
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-sandbox-webhook-secret}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  migration:
    identity-exchange: ${EVENT_EXCHANGE:hotel.events}
    identity-queue: ${LEGACY_IDENTITY_QUEUE:legacy.identity-projection.v1}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hotelai.backend: INFO
