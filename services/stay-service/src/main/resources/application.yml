spring:
  application:
    name: stay-service
  datasource:
    url: ${STAY_DB_URL:jdbc:postgresql://localhost:5432/stay_db}
    username: ${STAY_DB_USER:stay_user}
    password: ${STAY_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://identity-service:8101}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8101/.well-known/jwks.json}
          audiences: ${JWT_AUDIENCE:hotel-api}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8107}
  shutdown: graceful

hotel:
  security:
    internal-key: ${INTERNAL_SERVICE_KEY:change-this-internal-key}
    document-encryption-key: ${STAY_DOCUMENT_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  clients:
    inventory-url: ${INVENTORY_SERVICE_URL:http://room-inventory-service:8103}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICE_READ_TIMEOUT:5s}
  stay:
    time-zone: ${HOTEL_TIME_ZONE:Asia/Ho_Chi_Minh}
    standard-check-in-hour: ${HOTEL_CHECK_IN_HOUR:14}
    child-maximum-age: ${HOTEL_CHILD_MAX_AGE:11}
    primary-guest-minimum-age: ${HOTEL_PRIMARY_GUEST_MIN_AGE:18}
    maximum-extension-days: ${STAY_MAX_EXTENSION_DAYS:30}
  messaging:
    exchange: ${EVENT_EXCHANGE:hotel.events}
    reservation-queue: ${STAY_RESERVATION_QUEUE:stay.reservation-events.v1}
    reservation-routing-key: reservation.*.v1
    inventory-queue: ${STAY_INVENTORY_QUEUE:stay.inventory-events.v1}
    inventory-routing-key: inventory.#
    service-usage-queue: ${STAY_SERVICE_USAGE_QUEUE:stay.service-usage-events.v1}
    service-usage-routing-key: hotel-service.usage.*.v1
    dead-letter-exchange: ${EVENT_DL_EXCHANGE:hotel.events.dlx}
    dead-letter-queue: ${STAY_DL_QUEUE:stay.events.v1.dlq}
    dead-letter-routing-key: stay.source-events.v1.dead
    outbox-delay-ms: 1000
    saga-delay-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
