events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  # Docker có thể cấp IP mới cho API Gateway sau mỗi lần recreate. Phân giải
  # động qua DNS nội bộ để webhook Casso không bị giữ địa chỉ container cũ.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    location = /api/v1/payments/webhooks/casso {
      limit_except POST {
        deny all;
      }

      set $api_gateway http://api-gateway:8080;
      proxy_pass $api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }

    location / {
      return 404;
    }
  }
}
