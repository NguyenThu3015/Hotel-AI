spring:
  application:
    name: reservation-service
  datasource:
    url: ${RESERVATION_DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: ${RESERVATION_DB_USER:reservation_user}
    password: ${RESERVATION_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://identity-service:8101}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8101/.well-known/jwks.json}
          audiences: ${JWT_AUDIENCE:hotel-api}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8104}
  shutdown: graceful

hotel:
  security:
    internal-key: ${INTERNAL_SERVICE_KEY:change-this-internal-key}
  clients:
    inventory-url: ${INVENTORY_SERVICE_URL:http://room-inventory-service:8103}
    pricing-url: ${PRICING_SERVICE_URL:http://pricing-service:8105}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICE_READ_TIMEOUT:5s}
  reservation:
    hold-duration: ${RESERVATION_HOLD_DURATION:15m}
    maximum-stay-nights: ${MAXIMUM_STAY_NIGHTS:60}
    change-cutoff: ${RESERVATION_CHANGE_CUTOFF:24h}
  messaging:
    exchange: ${EVENT_EXCHANGE:hotel.events}
    payment-queue: ${PAYMENT_EVENT_QUEUE:reservation.payment-events.v1}
    payment-routing-key: payment.*.v1
    stay-queue: ${STAY_EVENT_QUEUE:reservation.stay-events.v1}
    stay-routing-keys:
      - stay.checked-in.v1
      - stay.checked-out.v1
      - stay.no-show.v1
    outbox-delay-ms: 1000
    hold-expiry-delay-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
