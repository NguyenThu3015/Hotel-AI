spring:
  application:
    name: review-service
  datasource:
    url: ${REVIEW_DB_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${REVIEW_DB_USER:review_user}
    password: ${REVIEW_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://identity-service:8101}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8101/.well-known/jwks.json}
          audiences: ${JWT_AUDIENCE:hotel-api}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8110}
  shutdown: graceful

hotel:
  review:
    ai-customer-analytics-url: ${AI_CUSTOMER_ANALYTICS_URL:http://localhost:8000}
    minimum-comment-length: ${REVIEW_MINIMUM_COMMENT_LENGTH:10}
    maximum-comment-length: ${REVIEW_MAXIMUM_COMMENT_LENGTH:5000}
    spam-window: ${REVIEW_SPAM_WINDOW:24h}
    prohibited-terms: ${REVIEW_PROHIBITED_TERMS:địt,đụ,mẹ kiếp}
    messaging:
      exchange: ${EVENT_EXCHANGE:hotel.events}
      stay-queue: ${REVIEW_STAY_QUEUE:review.stay-events.v1}
      stay-routing-key: stay.#.v1
      customer-queue: ${REVIEW_CUSTOMER_QUEUE:review.customer-events.v1}
      customer-routing-key: customer.profile.#.v1
      dead-letter-exchange: ${EVENT_DL_EXCHANGE:hotel.events.dlx}
      dead-letter-queue: ${REVIEW_DL_QUEUE:review.source-events.v1.dlq}
      dead-letter-routing-key: review.source-events.v1.dead
      outbox-delay-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
