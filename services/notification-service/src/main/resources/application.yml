spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DB_USER:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://identity-service:8101}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8101/.well-known/jwks.json}
          audiences: ${JWT_AUDIENCE:hotel-api}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8111}
  shutdown: graceful

hotel:
  security:
    internal-key: ${INTERNAL_SERVICE_KEY:change-this-internal-key}
  notification:
    exchange: ${EVENT_EXCHANGE:hotel.events}
    routing-key: ${NOTIFICATION_ROUTING_KEY:notification.#.requested.v1}
    identity-password-reset-routing-key: ${IDENTITY_PASSWORD_RESET_ROUTING_KEY:identity.password.reset-requested.v1}
    queue: ${NOTIFICATION_QUEUE:hotel.notification.events}
    dead-letter-exchange: ${NOTIFICATION_DLX:hotel.events.dlx}
    dead-letter-routing-key: ${NOTIFICATION_DLQ_ROUTING_KEY:notification.dead}
    dead-letter-queue: ${NOTIFICATION_DLQ:hotel.notification.events.dlq}
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:1000}
    base-retry-seconds: ${NOTIFICATION_BASE_RETRY_SECONDS:30}
    email:
      mode: ${EMAIL_ADAPTER_MODE:log}
      from: ${EMAIL_FROM:no-reply@example.invalid}
      fallback-to-mailpit: ${EMAIL_FALLBACK_TO_MAILPIT:false}
      fallback-host: ${MAILPIT_SMTP_HOST:mailpit}
      fallback-port: ${MAILPIT_SMTP_PORT:1025}
      fallback-auth: ${MAILPIT_SMTP_AUTH:false}
      fallback-starttls: ${MAILPIT_SMTP_STARTTLS:false}
      fallback-connection-timeout-ms: ${MAILPIT_SMTP_CONNECTION_TIMEOUT_MS:3000}
      fallback-timeout-ms: ${MAILPIT_SMTP_TIMEOUT_MS:5000}
      fallback-write-timeout-ms: ${MAILPIT_SMTP_WRITE_TIMEOUT_MS:5000}
    # SMS remains a local log adapter until a non-Brandname provider is selected.
    sms:
      provider: ${SMS_PROVIDER:log}
      api-url: ${SMS_API_URL:}
      api-key: ${SMS_API_KEY:}
    zalo:
      provider: ${ZALO_PROVIDER:log}
      api-url: ${ZALO_API_URL:https://rest.esms.vn/MainService.svc/json/SendZaloMessage_V5_post/}
      api-key: ${ZALO_API_KEY:}
      secret-key: ${ZALO_SECRET_KEY:}
      oa-id: ${ZALO_OA_ID:}
      template-id: ${ZALO_TEMPLATE_OTP_ID:}
      template-data-key: ${ZALO_TEMPLATE_DATA_KEY:otp}
      sandbox: ${ZALO_SANDBOX:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
