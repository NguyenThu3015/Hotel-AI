spring:
  application:
    name: hotel-service-catalog
  datasource:
    url: ${SERVICE_CATALOG_DB_URL:jdbc:postgresql://localhost:5432/service_catalog_db}
    username: ${SERVICE_CATALOG_DB_USER:service_catalog_user}
    password: ${SERVICE_CATALOG_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://identity-service:8101}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8101/.well-known/jwks.json}
          audiences: ${JWT_AUDIENCE:hotel-api}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hotel}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8108}
  shutdown: graceful

hotel:
  time-zone: ${HOTEL_TIME_ZONE:Asia/Ho_Chi_Minh}
  messaging:
    exchange: ${EVENT_EXCHANGE:hotel.events}
    stay-queue: ${SERVICE_CATALOG_STAY_QUEUE:service-catalog.stay-events.v1}
    stay-routing-key: stay.#.v1
    dead-letter-exchange: ${EVENT_DL_EXCHANGE:hotel.events.dlx}
    dead-letter-queue: ${SERVICE_CATALOG_DL_QUEUE:service-catalog.events.v1.dlq}
    dead-letter-routing-key: service-catalog.source-events.v1.dead
    outbox-delay-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
