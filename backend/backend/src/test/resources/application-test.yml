spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
